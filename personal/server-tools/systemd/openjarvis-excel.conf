# Drop-in untuk openjarvis.service: nyalakan tool Excel dulu dan tunggu sampai
# port 8017 siap (paling lama 30 detik), supaya OpenJarvis langsung mendapat tool Excel.
[Unit]
Wants=jarvis-excel.service
After=jarvis-excel.service

[Service]
ExecStartPre=/bin/bash -c 'for i in $(seq 1 30); do curl -s -o /dev/null --max-time 2 http://127.0.0.1:8017/mcp && exit 0; sleep 1; done; exit 0'
