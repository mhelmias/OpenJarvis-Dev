# Drop-in untuk openjarvis.service: nyalakan tool SSH (Jarvis Panel) dulu dan tunggu port 8019.
[Unit]
Wants=jarvis-panel-mcp.service
After=jarvis-panel-mcp.service

[Service]
ExecStartPre=/bin/bash -c 'for i in $(seq 1 30); do curl -s -o /dev/null --max-time 2 http://127.0.0.1:8019/mcp && exit 0; sleep 1; done; exit 0'
